# ──────────────────────────────────────────────
# mihomo (Clash Meta) 代理配置模板
#
# 使用方法：
#   1. 把下面的 url 换成你的机场订阅链接
#   2. 根据需要修改 filter 来选择节点地区
#   3. 保存后 docker compose restart mihomo
#
# 注意：
#   - provider 名字不能用 "default"（mihomo 保留名）
#   - allow-lan 必须为 true，其他容器通过 compose 网络访问代理
#   - filter/exclude-filter 用正则匹配节点名
#   - grok.com 对部分地区的 IP 有风控，建议使用美国节点
#
# 如果你有现成的 clash 配置文件，直接替换整个文件即可。
# ──────────────────────────────────────────────

mixed-port: 7897
allow-lan: true
bind-address: "*"
mode: rule
log-level: warning
ipv6: false
unified-delay: true

# API 管理（可用于切换节点）
external-controller: "0.0.0.0:9090"
secret: "mihomo-admin"

proxy-providers:
  my-sub:
    type: http
    url: "在这里填入你的订阅链接"
    interval: 86400
    path: ./providers/my-sub.yaml
    health-check:
      enable: true
      url: https://www.google.com
      interval: 300
    # 只保留美国节点（grok.com 对部分国家 IP 有风控）
    # 如需其他地区，修改此正则，如 "(?i)日本|JP-" 或 "(?i)美国|日本|新加坡"
    filter: "(?i)美国|US-"
    # 排除信息条目和 IPv6 节点
    exclude-filter: "(?i)有效期|剩余|GB|expire|traffic|V6"

proxy-groups:
  - name: "PROXY"
    type: url-test
    use:
      - my-sub
    url: https://www.google.com
    interval: 300

rules:
  # 私有网络直连
  - IP-CIDR,127.0.0.0/8,DIRECT
  - IP-CIDR,192.168.0.0/16,DIRECT
  - IP-CIDR,10.0.0.0/8,DIRECT
  - IP-CIDR,172.16.0.0/12,DIRECT
  # 其他全部走代理
  - MATCH,PROXY
