# ──────────────────────────────────────────────
# mihomo (Clash Meta) 代理配置模板
#
# 使用方法：
#   1. 把下面的 url 换成你的机场订阅链接
#   2. 保存后 docker compose restart mihomo
#
# 注意：provider 名字不能用 "default"（mihomo 保留名）
# allow-lan 必须为 true，因为其他容器（grok2api/grok-register）
# 需要通过 compose 网络访问本代理。
#
# 如果你有现成的 clash 配置文件，直接替换整个文件即可。
# ──────────────────────────────────────────────

mixed-port: 7897
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: true
unified-delay: true

# 订阅节点（自动更新）
proxy-providers:
  my-sub:
    type: http
    url: "在这里填入你的订阅链接"
    interval: 86400
    path: ./providers/my-sub.yaml
    health-check:
      enable: true
      url: https://www.google.com
      interval: 300

# 代理组
proxy-groups:
  - name: "PROXY"
    type: select
    use:
      - my-sub

# 路由规则
rules:
  # 私有网络直连
  - IP-CIDR,127.0.0.0/8,DIRECT
  - IP-CIDR,192.168.0.0/16,DIRECT
  - IP-CIDR,10.0.0.0/8,DIRECT
  - IP-CIDR,172.16.0.0/12,DIRECT
  # 其他全部走代理
  - MATCH,PROXY
