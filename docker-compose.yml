name: grok-stack

services:
  # ──────────────────────────────────────────────
  # 代理：mihomo (Clash Meta)
  # 订阅链接通过环境变量 SUB_URL 传入
  # ──────────────────────────────────────────────
  mihomo:
    container_name: grok-mihomo
    image: docker.io/metacubex/mihomo:latest
    volumes:
      - ./mihomo/config.yaml:/root/.config/mihomo/config.yaml:ro
      - ./data/mihomo:/root/.config/mihomo
    environment:
      TZ: Asia/Shanghai
      SUB_URL: ${SUB_URL:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -n "$$SUB_URL" ]; then
          sed -i "s|在这里填入你的订阅链接|$$SUB_URL|g" /root/.config/mihomo/config.yaml
        fi
        /mihomo -d /root/.config/mihomo -f /root/.config/mihomo/config.yaml
    restart: unless-stopped
    networks:
      - grok-net

  # ──────────────────────────────────────────────
  # API 网关：grok2api
  # 数据持久化到 ./data/grok2api
  # ──────────────────────────────────────────────
  grok2api:
    container_name: grok2api
    image: ghcr.io/chenyme/grok2api:latest
    ports:
      - "8000:8000"
    volumes:
      - ./grok2api/config.yaml:/run/grok2api/config.yaml:ro
      - ./data/grok2api:/app/data
    environment:
      TZ: Asia/Shanghai
    restart: unless-stopped
    depends_on:
      - mihomo
    networks:
      - grok-net

  # ──────────────────────────────────────────────
  # Web 控制台
  # 数据持久化到 ./data/web 和 ./output
  # ──────────────────────────────────────────────
  web:
    container_name: grok-web
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "8088:8080"
    volumes:
      - ./data/web:/app/data
      - ./output:/app/output
    environment:
      TZ: Asia/Shanghai
      WEB_PORT: "8080"
    restart: unless-stopped
    depends_on:
      - grok2api
    networks:
      - grok-net

networks:
  grok-net:
    driver: bridge
