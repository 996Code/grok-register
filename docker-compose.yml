name: grok-stack

services:
  # ──────────────────────────────────────────────
  # 代理：mihomo (Clash Meta)
  # 订阅链接通过环境变量 SUB_URL 传入，不写入文件
  # 仅容器内部网络可访问，不对外暴露端口
  # ──────────────────────────────────────────────
  mihomo:
    container_name: grok-mihomo
    image: docker.io/metacubex/mihomo:latest
    volumes:
      - ./mihomo/config.yaml:/root/.config/mihomo/config.yaml:ro
      - mihomo-data:/root/.config/mihomo
    environment:
      TZ: Asia/Shanghai
      SUB_URL: ${SUB_URL:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -n "$$SUB_URL" ]; then
          sed -i "s|在这里填入你的订阅链接|$$SUB_URL|g" /root/.config/mihomo/config.yaml
        fi
        /mihomo -d /root/.config/mihomo -f /root/.config/mihomo/config.yaml
    restart: unless-stopped
    networks:
      - grok-net

  # ──────────────────────────────────────────────
  # API 网关：grok2api
  # 对外暴露 8000 端口
  # ──────────────────────────────────────────────
  grok2api:
    container_name: grok2api
    image: ghcr.io/chenyme/grok2api:latest
    ports:
      - "8000:8000"
    volumes:
      - ./grok2api/config.yaml:/run/grok2api/config.yaml:ro
      - grok2api-data:/app/data
    environment:
      TZ: Asia/Shanghai
    restart: unless-stopped
    depends_on:
      - mihomo
    networks:
      - grok-net

  # ──────────────────────────────────────────────
  # 注册机：grok-register
  # 默认不启动，手动触发：
  #   docker compose run --rm grok-register
  # ──────────────────────────────────────────────
  grok-register:
    profiles: ["register"]
    container_name: grok-register
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./config.json:/app/config.json:ro
      - ./output:/app/output
    environment:
      TZ: Asia/Shanghai
    depends_on:
      - mihomo
      - grok2api
    networks:
      - grok-net

networks:
  grok-net:
    driver: bridge

volumes:
  mihomo-data:
  grok2api-data:
